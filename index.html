<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Y12 English Language Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>English Language Portfolio</h1>
        <p>Year 12 A-Level Collaborative Writing</p>
    </header>

    <main class="hub-container">
        
        <!-- MAIN HEADING 1: FASHION -->
        <section class="topic-section">
            <h2 class="main-heading">Fashion</h2>
            <p class="topic-description">PLACEHOLDER</p>
            
            <!-- SUB-HEADINGS (CLICKABLE ESSAYS) -->
            <ul class="essay-links-list">
                <li>
                    <a href="essays/history-of-fashion.html" class="sub-heading-link">
                        <span class="genre-tag informative">Informative</span>
                        <strong>The History of Fashion:</strong> Brief desc
                    </a>
                </li>
                <li>
                    <a href="essays/fast-fashion.html" class="sub-heading-link">
                        <span class="genre-tag opinion">Opinion</span>
                        <strong>Title:</strong> Brief desc
                    </a>
                </li>
            </ul>
        </section>

         <!-- MAIN HEADING 2: WIP-->
        <section class="topic-section">
            <h2 class="main-heading">WIP</h2>
            <p class="topic-description">PLACEHOLDER</p>

                <!-- SUB-HEADINGS -->
                <ul class="essay-links-list">
                    <li>
                        <a href="essays/placeholder.html" class="sub-heading-link">
                            <span class="genre-tag argumentative">Argumentative</span>
                            <strong>Title:</strong> Brief desc
                        </a>
                    </li>
                </ul>
        </section>

    </main>

    <!-- Floating Edit Button -->
    <button id="edit-btn" onclick="toggleEditMode()" style="position: fixed; bottom: 20px; right: 20px; padding: 12px 20px; background: #1a202c; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.15);">
        ✏️ Edit Mode
    </button>

    <script>
        const GITHUB_CONFIG = {
            owner: 'KH8-Y12-English',
            repo: 'y12-english-',
            filePath: 'index.html',
            branch: 'main',
            password: 'english123',
            // Remember to generate a new token on GitHub and paste it here
            token: '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' 
        };

        let isAuthenticated = false;

        // UTF-8 Safe Base64 Encoder
        function utf8_to_b64(str) {
            return window.btoa(unescape(encodeURIComponent(str)));
        }

        function toggleEditMode() {
            if (!isAuthenticated) {
                const input = prompt("Enter the password to edit this page:");
                if (input === GITHUB_CONFIG.password) {
                    isAuthenticated = true;
                    enableEditing();
                } else {
                    alert("Incorrect password.");
                }
            } else {
                pushChangesToGitHub();
            }
        }

        function enableEditing() {
            document.querySelectorAll('.topic-description, .main-heading, .essay-content p').forEach(el => {
                el.contentEditable = "true";
                el.style.outline = "2px dashed #2b6cb0";
                el.style.padding = "4px";
                el.style.backgroundColor = "#fffde7";
            });
            
            const btn = document.getElementById('edit-btn');
            btn.innerText = "💾 Save Changes to Live Site";
            btn.style.backgroundColor = "#2b6cb0";
        }

        async function pushChangesToGitHub() {
            const btn = document.getElementById('edit-btn');
            btn.innerText = "⏳ Saving...";
            btn.disabled = true;

            // Clean up temporary edit attributes and inline styles before serializing HTML
            document.querySelectorAll('[contenteditable]').forEach(el => {
                el.removeAttribute('contenteditable');
                el.style.outline = "";
                el.style.padding = "";
                el.style.backgroundColor = "";
            });

            try {
                // Fetch the current file details from GitHub to retrieve its SHA
                const getFileUrl = `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.filePath}`;
                const getResponse = await fetch(getFileUrl, {
                    headers: { 
                        'Authorization': `Bearer ${GITHUB_CONFIG.token}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });

                if (!getResponse.ok) {
                    throw new Error(`Failed to fetch repo details: ${getResponse.statusText}`);
                }
                
                const fileData = await getResponse.json();

                // Capture current document structure
                const updatedHTML = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
                const encodedContent = utf8_to_b64(updatedHTML);

                // Send update request via GitHub API
                const putResponse = await fetch(getFileUrl, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${GITHUB_CONFIG.token}`,
                        'Content-Type': 'application/json',
                        'Accept': 'application/vnd.github.v3+json'
                    },
                    body: JSON.stringify({
                        message: 'Update page content via inline editor',
                        content: encodedContent,
                        sha: fileData.sha,
                        branch: GITHUB_CONFIG.branch
                    })
                });

                if (putResponse.ok) {
                    alert("Success! Changes pushed to GitHub. The live site will update in ~60 seconds.");
                } else {
                    const errData = await putResponse.json();
                    alert("Error saving: " + errData.message);
                }
            } catch (err) {
                alert("Error: " + err.message);
                console.error(err);
            }

            // Reset button state
            btn.innerText = "✏️ Edit Mode";
            btn.style.backgroundColor = "#1a202c";
            btn.disabled = false;
            isAuthenticated = false;
        }
    </script>
</body>
</html>
