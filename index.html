<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Y12 English Language Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>English Language Portfolio</h1>
        <p>Year 12 A-Level Collaborative Writing</p>
    </header>

    <main class="hub-container">
        
        <!-- MAIN HEADING 1: FASHION -->
        <section class="topic-section">
            <h2 class="main-heading">Fashion</h2>
            <p class="topic-description">PLACEHOLDER</p>
            
            <!-- SUB-HEADINGS (CLICKABLE ESSAYS) -->
            <ul class="essay-links-list">
                <li>
                    <a href="essays/history-of-fashion.html" class="sub-heading-link">
                        <span class="genre-tag informative">Informative</span>
                        <strong>The History of Fashion:</strong> Brief desc
                    </a>
                </li>
                <li>
                    <a href="essays/fast-fashion.html" class="sub-heading-link">
                        <span class="genre-tag opinion">Opinion</span>
                        <strong>Title:</strong> Brief desc
                    </a>
                </li>
            </ul>
        </section>

         <!-- MAIN HEADING 2: WIP-->
        <section class="topic-section">
            <h2 class="main-heading">WIP</h2>
            <p class="topic-description">PLACEHOLDER</p>

                <!-- SUB-HEADINGS -->
                <ul class="essay-links-list">
                    <li>
                        <a href="essays/placeholder.html" class="sub-heading-link">
                            <span class="genre-tag argumentative">Argumentative</span>
                            <strong>Title:</strong> Brief desc
                        </a>
                    </li>
                </ul>
        </section>

    </main>

    <!-- Floating Edit Button -->
<button id="edit-btn" onclick="toggleEditMode()" style="position: fixed; bottom: 20px; right: 20px; padding: 10px 18px; background: #1a202c; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; z-index: 1000;">
  ✏️ Edit Mode
</button>

<script>
  let isAuthenticated = false;
  
  // SIMPLE PASSWORD PROTECTION (Change "english123" to your preferred password)
  const SECRET_PASSWORD = "english123";

  function toggleEditMode() {
    if (!isAuthenticated) {
      const input = prompt("Enter the editor password:");
      if (input === SECRET_PASSWORD) {
        isAuthenticated = true;
        enableEditing();
        alert("Edit mode unlocked! Click on any text paragraph or heading to edit it.");
      } else {
        alert("Incorrect password.");
      }
    } else {
      disableEditing();
    }
  }

  function enableEditing() {
    // Make text paragraphs and descriptions editable directly on the screen
    document.querySelectorAll('.topic-description, .main-heading, .essay-content p').forEach(el => {
      el.contentEditable = "true";
      el.style.border = "1px dashed #2b6cb0";
      el.style.padding = "4px";
      el.style.backgroundColor = "#fffde7";
    });
    
    document.getElementById('edit-btn').innerText = "🔒 Save & Exit Edit Mode";
    document.getElementById('edit-btn').onclick = saveChanges;
  }

  function saveChanges() {
    // Disable editing visually
    document.querySelectorAll('[contenteditable]').forEach(el => {
      el.contentEditable = "false";
      el.style.border = "none";
      el.style.backgroundColor = "transparent";
    });

    document.getElementById('edit-btn').innerText = "✏️ Edit Mode";
    document.getElementById('edit-btn').onclick = toggleEditMode;
    isAuthenticated = false;

    alert("Changes saved locally! To make them permanent for everyone, push the updated file or submit via your backend service.");
  }
</script>

</body>
</html>
